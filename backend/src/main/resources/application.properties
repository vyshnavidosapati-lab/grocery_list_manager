spring.application.name=grocery-manager

server.port=8080

# MySQL Configuration
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/grocery_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:grocery_app}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}